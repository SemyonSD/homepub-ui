server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API requests to the backend (app uses relative /api/v1/...)
  # Use a variable so nginx resolves upstream at request time, not at startup (avoids "host not found in upstream" when "api" is missing, e.g. on Render).
  location /api/ {
    set $backend http://api:3000;
    resolver 127.0.0.11 valid=10s;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
