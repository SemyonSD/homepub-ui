<tui-block-status [card]="true"
                  class="card">
  <button tuiIconButton
          type="button"
          class="delete-button"
          [icon]="isSubMenuOpen ? 'tuiIconCornerLeftDown' : 'tuiIconMoreHorizontalLarge'"
          appearance="outline"
          (click)="toggleSubMenu()">
  </button>
  <div *ngIf="isSubMenuOpen"
       class="sub-menu">
    <button tuiButton
            appearance="outline"
            (click)="editRecipe()">
      Edit
    </button>
    <button tuiButton
            appearance="accent"
            (click)="deleteRecipe()">
      Delete
    </button>
  </div>
  <div class="tui-text_h3" style="margin-bottom: 2rem">
    {{recipe()?.title}}
  </div>
  <tui-expand [expanded]="!expanded" class="expandable">
    <tui-scrollbar class="card_content">
      <div *ngFor="let ingredient of recipe()?.ingredients">
        <div class="d-fx ai-c gap-5">
          <span>{{ingredient.name}}</span>
          <span>{{ingredient.measurementValue}}</span>
          <span>{{ingredient.measurementName.label}}</span>
        </div>
      </div>
    </tui-scrollbar>
  </tui-expand>
  <tui-expand [expanded]="expanded">
    <ng-template tuiExpandContent>
      <tui-scrollbar class="card_content">
        <p>{{recipe()?.description}}</p>
      </tui-scrollbar>
    </ng-template>
  </tui-expand>
  <button
    tuiButton
    type="button"
    appearance="outline"
    (click)="toggle()"
  >
    {{expanded ? 'Show ingredients' : 'Show recipe'}}
  </button>
</tui-block-status>
