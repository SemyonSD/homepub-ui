server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy /api/ to backend. BACKEND_URL and BACKEND_HOST replaced at build time (defaults: http://api:3000, host "api").
  # Variable + resolver so nginx doesn't resolve upstream at startup.
  location /api/ {
    set $backend http://api:3000;
    resolver 127.0.0.11 valid=10s;
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host __BACKEND_HOST__;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    # Required when backend is HTTPS (e.g. Render)
    proxy_ssl_server_name on;
    proxy_ssl_name __BACKEND_HOST__;
    proxy_ssl_verify off;
    proxy_connect_timeout 30s;
    proxy_read_timeout 60s;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
